name: PR Build and Check

on:
  pull_request:
    branches:
      - main
      - release-*

jobs:
  package-version-match:
    name: Package Version Match
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Verify package version matches the RHDH release
        env:
          RHDH_BRANCH: ${{ github.base_ref }}
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/redhat-developer/rhdh/${RHDH_BRANCH}/package.json" \
            --output "$RUNNER_TEMP/rhdh-package.json"

          RHDH_PACKAGE_JSON="$RUNNER_TEMP/rhdh-package.json" node <<'NODE'
          const fs = require('node:fs');

          const parseVersion = (label, version) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.exec(version ?? '');
            if (!match) {
              console.error(`::error::${label} has an invalid semantic version: ${version}`);
              process.exit(1);
            }
            return `${match[1]}.${match[2]}`;
          };

          const utilsVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const rhdhVersion = JSON.parse(fs.readFileSync(process.env.RHDH_PACKAGE_JSON, 'utf8')).version;
          const utilsRelease = parseVersion('Utilities package version', utilsVersion);
          const rhdhRelease = parseVersion('RHDH package version', rhdhVersion);

          console.log(`RHDH ${process.env.RHDH_BRANCH} version: ${rhdhVersion}`);
          console.log(`Utilities package version: ${utilsVersion}`);

          if (utilsRelease !== rhdhRelease) {
            console.error(`::error::Utilities package version ${utilsVersion} must use the ${rhdhRelease}.x release line to match RHDH ${rhdhVersion} on ${process.env.RHDH_BRANCH}. Only the patch version may differ.`);
            process.exit(1);
          }

          console.log(`Utilities package is on the matching ${utilsRelease}.x release line.`);
          NODE

  build:
    name: Build and Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Checks
        run: yarn check

      - name: Build
        run: yarn build

      - name: Run Tests
        run: yarn test

  docs-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for docs changes
        id: docs-changes
        working-directory: .
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          DOCS_CHANGED=$(git diff --name-only "$BASE_REF"...HEAD -- docs/ | grep '\.md$' || true)
          if [ -z "$DOCS_CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No markdown changes in docs/"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            DELIM=$(openssl rand -hex 8)
            echo "changed_files<<$DELIM" >> "$GITHUB_OUTPUT"
            echo "$DOCS_CHANGED" >> "$GITHUB_OUTPUT"
            echo "$DELIM" >> "$GITHUB_OUTPUT"
            echo "Changed docs files:"
            echo "$DOCS_CHANGED"
          fi

      - name: Setup Node.js
        if: steps.docs-changes.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        if: steps.docs-changes.outputs.skip != 'true'
        run: corepack enable

      - name: Install docs dependencies
        if: steps.docs-changes.outputs.skip != 'true'
        run: yarn install --immutable

      - name: Build documentation (validates internal links)
        if: steps.docs-changes.outputs.skip != 'true'
        run: yarn build

      - name: Check external links in changed files
        if: steps.docs-changes.outputs.skip != 'true'
        run: |
          FILES=$(echo "${{ steps.docs-changes.outputs.changed_files }}" | sed 's|^docs/||' | xargs)
          echo "Checking files: $FILES"
          yarn markdown-link-check --config .markdown-link-check.json $FILES

  version-check:
    name: Version Bump Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for source changes requiring version bump
        id: changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          NEEDS_BUMP=false
          while IFS= read -r file; do
            case "$file" in
              src/*|tsconfig.build.json|tsconfig.base.json)
                NEEDS_BUMP=true
                break
                ;;
              package.json)
                # Check if anything other than "version" changed
                OTHER_CHANGES=$(git diff "$BASE_REF"...HEAD -- package.json | grep -E '^[+-]\s' | grep -v -E '^\+\+\+|^---' | grep -v '"version"' || true)
                if [ -n "$OTHER_CHANGES" ]; then
                  NEEDS_BUMP=true
                  break
                fi
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "needs_bump=$NEEDS_BUMP" >> "$GITHUB_OUTPUT"

      - name: Verify version bump and changelog
        if: steps.changes.outputs.needs_bump == 'true'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          PR_VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(git show "$BASE_REF":package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")

          echo "Base version: $BASE_VERSION"
          echo "PR version:   $PR_VERSION"

          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Source files or dependencies changed but package version was not bumped. Please update the version in package.json."
            exit 1
          fi

          HIGHER=$(node -e "
            const [a, b] = ['$PR_VERSION', '$BASE_VERSION'].map(v => v.split('.').map(Number));
            const isHigher = a[0] > b[0] || (a[0] === b[0] && a[1] > b[1]) || (a[0] === b[0] && a[1] === b[1] && a[2] > b[2]);
            process.exit(isHigher ? 0 : 1);
          " && echo "true" || echo "false")

          if [ "$HIGHER" != "true" ]; then
            echo "::error::PR version ($PR_VERSION) must be higher than base version ($BASE_VERSION)."
            exit 1
          fi

          echo "Version bumped from $BASE_VERSION to $PR_VERSION"

          CHANGELOG_CHANGED=$(git diff --name-only "$BASE_REF"...HEAD -- docs/changelog.md)
          if [ -z "$CHANGELOG_CHANGED" ]; then
            echo "::error::Version was bumped but docs/changelog.md was not updated. Please add a changelog entry for version $PR_VERSION."
            exit 1
          fi
          echo "Changelog updated for version bump"
