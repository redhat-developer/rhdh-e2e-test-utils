# The RHDH chart replaces Bitnami's PostgreSQL image with Red Hat's
# registry.redhat.io/rhel9/postgresql-15; Bitnami postgresql >= 18 hard-fails
# unrecognized images unless this flag is set (bitnami/charts#30850).
global:
  security:
    allowInsecureImages: true

extraAppConfig:
  - configMapRef: app-config-rhdh
    filename: app-config-rhdh.yaml
extraEnvFrom:
  - secretRef:
      name: rhdh-secrets
intelligentAssistant:
  enabled: false
